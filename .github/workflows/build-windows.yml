name: Build Windows EXE

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller qa-distance-picker-windows.spec --noconfirm

      - name: Bundle VC++ runtime DLLs
        run: |
          $vcDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Redist\MSVC"
          if (-not (Test-Path $vcDir)) {
            $vcDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
          }
          $latest = Get-ChildItem $vcDir -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dllDir = Join-Path $latest.FullName "x64\Microsoft.VC143.CRT"
          $dest = "dist\qa-distance-picker"
          Copy-Item "$dllDir\vcruntime140.dll" $dest
          Copy-Item "$dllDir\vcruntime140_1.dll" $dest
          Copy-Item "$dllDir\msvcp140.dll" $dest
          Write-Host "Bundled VC++ runtime from $dllDir"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-distance-picker-windows
          path: dist/qa-distance-picker/
          retention-days: 30
